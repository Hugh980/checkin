name: keepalive

on:
  workflow_dispatch:
  schedule:
    # Run on the 1st of every month at 03:17 UTC.
    - cron: "17 3 1 * *"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update keepalive marker
        shell: bash
        run: |
          mkdir -p .github
          printf 'Last keepalive: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/keepalive.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt

          if git diff --cached --quiet; then
            echo "No keepalive change to commit."
            exit 0
          fi

          git commit -m "chore: keep scheduled workflows active"
          git push
