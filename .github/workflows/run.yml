name: run

# GitHub-hosted runners cannot complete an interactive Cloudflare Turnstile challenge.
# Keep this workflow for explicit manual diagnostics only; daily browser opening is handled locally.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glados-checkin-manual
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          DOMAIN: glados.vip
          NOTIFY: ${{ secrets.NOTIFY }}
